apiVersion: v1
kind: Secret
metadata:
  name: automotive-catalog-secrets
  namespace: automotive-catalog
type: Opaque
stringData:
  JWT_SECRET: "change-me"
  POSTGRES_DSN: "postgres://catalog:password@postgres-svc:5432/catalog?sslmode=require"
  MSSQL_DSN: "sqlserver://user:password@mssql-svc:1433?database=catalog"
  ORACLE_DSN: "oracle://user:password@oracle-svc:1521/ORCLPDB1"
  REDIS_ADDR: "redis-svc:6379"
  REDIS_PASSWORD: ""
  KAFKA_BROKERS: "kafka-svc:9092"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_S3_BUCKET: "automotive-catalog-assets"
